<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vozes que não podem gritar — Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages.css') }}">

</head>

<body class="page-login d-flex align-items-center justify-content-center vh-100">

    <div class="login-card">
        <a href="/" class="back-link d-flex align-items-center gap-1">
            <i class="bi bi-arrow-left-short fs-4"></i> Voltar
        </a>

        <h3 class="text-center text-brand mb-4">
            Login
        </h3>

        <div id="alert-erro" class="alert alert-danger d-none" role="alert"></div>

        <form id="formLogin">

            <div class="mb-3">
                <label class="form-label text-secondary small text-uppercase">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    class="form-control"
                    required
                    placeholder="seu@email.com">
            </div>

            <div class="mb-3">
                <label class="form-label text-secondary small text-uppercase">
                    Senha
                </label>

                <div class="input-group">

                    <input
                        type="password"
                        id="senha"
                        class="form-control"
                        required
                        placeholder="••••••••">

                    <button
                        class="btn btn-outline-secondary"
                        type="button"
                        id="toggleSenha">

                        <i class="bi bi-eye-slash" id="iconeOlho"></i>

                    </button>

                </div>
            </div>

            <button type="submit" class="btn btn-brand w-100 mt-3">
                Entrar
            </button>

        </form>

        <div class="text-center mt-4 border-top pt-3">
            <p class="small text-muted mb-0">Ainda não tem uma conta? <a href="/cadastro" class="text-brand text-decoration-none">Cadastre-se aqui</a></p>
        </div>

    </div>

    <script src="{{ url_for('static', filename='Login/script.js') }}"></script>

</body>
</html>
