<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vozes que não podem gritar — Cadastro</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages.css') }}">
</head>
<body class="page-register d-flex align-items-center justify-content-center vh-100 py-4">

    <div class="register-card my-auto">
        <h3 class="text-center text-brand mb-2">Crie sua Conta</h3>
        <p class="text-muted text-center small mb-4">Junte-se a nós no combate aos maus-tratos de animais</p>
        
        <div id="alert-message" class="alert d-none" role="alert"></div>

        <form id="formCadastro">
            <div class="mb-3">
                <label class="form-label">Nome de Usuário</label>
                <input type="text" id="nome_usuario" class="form-control" required placeholder="ex: JoaoSilva">
            </div>
            <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="email" id="email" class="form-control" required placeholder="seu@email.com">
            </div>


            <div class="mb-3">
                <label class="form-label">Senha</label>
                <div class="input-group">
                    <input type="password" id="senha" class="form-control" required placeholder="Mínimo 8 caracteres">
                    <button class="btn btn-outline-secondary" type="button" id="toggleSenha">
                        <i class="bi bi-eye-slash" id="iconeOlho"></i>
                    </button>
                </div>
            </div>


            <button type="submit" class="btn btn-brand w-100 mt-3">Registrar-se</button>
        </form>

        <div class="text-center mt-4 border-top pt-3">
            <p class="small text-muted mb-0">Já possui uma conta? <a href="/login" class="text-brand text-decoration-none">Entre aqui</a></p>
        </div>
    </div>
    <script src="{{ url_for('static', filename='Login/script_cadastro.js') }}"></script>
</body>
</html>
