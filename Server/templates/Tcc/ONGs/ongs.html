<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel CRUD — ONGs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container my-5">
        <header class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-2 border-warning border-opacity-25">
            <div class="d-flex align-items-center gap-3">
                <div class="bg-white p-3 rounded-4 shadow-sm text-brand fs-2"><i class="bi bi-heart-fill"></i></div>
                <div>
                    <h1 class="h2 text-brand m-0 fw-bold">Gerenciamento de ONGs</h1>
                    <small class="text-muted">Painel Administrativo Geral</small>
                </div>
            </div>
            <a href="{{ url_for('test_index') }}" class="btn btn-outline-brand"><i class="bi bi-arrow-left-short fs-4"></i> Voltar para o site</a>
        </header>

        <div class="row g-4">
            <section class="col-lg-5">
                <div class="crud-card">
                    <h2 class="h4 text-brand mb-4"><i class="bi bi-plus-circle-fill"></i> Cadastrar ONG</h2>
                    <div class="mb-3"><label class="form-label" for="c-nome">Nome da instituição</label><input id="c-nome" class="form-control" maxlength="150" placeholder="Ex.: Instituto Patas"></div>
                    <div class="mb-3"><label class="form-label" for="c-end">Endereço físico</label><input id="c-end" class="form-control" placeholder="Rua, número, cidade"></div>
                    <div class="mb-3"><label class="form-label" for="c-site">Site</label><input id="c-site" type="url" class="form-control" placeholder="https://exemplo.org.br"></div>
                    <div class="mb-4"><label class="form-label" for="c-pix">Chave PIX</label><input id="c-pix" class="form-control" placeholder="CPF, CNPJ, e-mail, telefone ou UUID"></div>
                    <button type="button" class="btn btn-brand w-100" onclick="createOng()"><i class="bi bi-check-lg me-1"></i> Salvar registro</button>
                </div>

                <div class="crud-card">
                    <h2 class="h4 text-brand mb-4"><i class="bi bi-pencil-square"></i> Atualizar ONG</h2>
                    <div class="mb-3"><label class="form-label" for="u-id">ID</label><input id="u-id" class="form-control bg-light text-muted" readonly placeholder="Selecione uma ONG na tabela"></div>
                    <div class="mb-3"><label class="form-label" for="u-nome">Nome da instituição</label><input id="u-nome" class="form-control" maxlength="150"></div>
                    <div class="mb-3"><label class="form-label" for="u-end">Endereço físico</label><input id="u-end" class="form-control"></div>
                    <div class="mb-3"><label class="form-label" for="u-site">Site</label><input id="u-site" type="url" class="form-control"></div>
                    <div class="mb-4"><label class="form-label" for="u-pix">Chave PIX</label><input id="u-pix" class="form-control"></div>
                    <button type="button" class="btn btn-brand w-100" onclick="updateOng()"><i class="bi bi-arrow-clockwise me-1"></i> Atualizar informações</button>
                </div>
            </section>

            <section class="col-lg-7">
                <div class="crud-card">
                    <h2 class="h4 text-brand mb-4"><i class="bi bi-table"></i> ONGs cadastradas</h2>
                    <div class="table-responsive-wrapper"><div class="table-responsive">
                        <table id="tbl-ongs" class="table table-hover align-middle">
                            <thead><tr><th>ID</th><th>Instituição</th><th>Endereço</th><th>Site</th><th>PIX</th><th class="text-center">Ações</th></tr></thead>
                            <tbody class="table-group-divider"></tbody>
                        </table>
                    </div></div>
                </div>
                <div class="crud-card">
                    <div class="d-flex justify-content-between align-items-center mb-3"><span class="text-secondary fw-semibold font-monospace small"><i class="bi bi-terminal-fill"></i> Respostas do servidor</span><button type="button" class="btn btn-link btn-sm text-decoration-none text-muted" onclick="clearLog()"><i class="bi bi-trash3"></i> Limpar console</button></div>
                    <pre id="log" class="terminal-log mb-0">— pronto para monitorar requisições —</pre>
                </div>
            </section>
        </div>
    </main>
    <footer><p class="mb-0">© 2026 - Proteja • Respeite • Ame</p></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='ONGs/script.js') }}"></script>
</body>
</html>
