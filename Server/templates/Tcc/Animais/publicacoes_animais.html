<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicações de Animais | Vozes que não podem gritar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages.css', v='20261017-brand-contrast') }}">
</head>

<body class="page-animals">
    <nav class="navbar navbar-dark">
        <div class="container page-animals-container">
            <a class="navbar-brand fw-bold site-brand" href="/">
                <i class="bi bi-paw-fill me-2"></i>
                Vozes que não podem gritar
            </a>

            <div class="d-flex gap-2">
                <a href="/animais-perdidos" class="btn btn-voltar">
                    <i class="bi bi-plus-circle me-1"></i>
                    Cadastrar animal
                </a>
                <a href="/" class="btn btn-voltar">
                    <i class="bi bi-arrow-left me-1"></i>
                    Voltar
                </a>
            </div>
        </div>
    </nav>

    <main class="container page-animals-container py-5">
        <header class="page-animals-header">
            <div class="page-animals-icon">
                <i class="bi bi-grid-3x3-gap-fill"></i>
            </div>
            <h1>Publicações de animais</h1>
            <p>
                Encontre informações de animais perdidos e encontrados.
            </p>
        </header>

        <section class="animal-filter-card mb-4">
            <div class="row g-3 align-items-end">
                <div class="col-lg-7">
                    <label for="filtroTexto" class="form-label">Pesquisar</label>
                    <input id="filtroTexto" class="form-control"
                           placeholder="Nome, espécie, local ou característica">
                </div>

                <div class="col-lg-3">
                    <label for="filtroStatus" class="form-label">Situação</label>
                    <select id="filtroStatus" class="form-select">
                        <option value="">Todas</option>
                        <option value="Perdido">Perdidos</option>
                        <option value="Encontrado">Encontrados</option>
                    </select>
                </div>

                <div class="col-lg-2">
                    <button id="limparFiltros" class="btn btn-animals-outline w-100">
                        <i class="bi bi-x-circle me-1"></i>
                        Limpar
                    </button>
                </div>
            </div>
        </section>

        <div class="d-flex justify-content-between align-items-center mb-3 text-white">
            <h2 class="h4 fw-bold mb-0">Todos os registros</h2>
            <span id="contadorAnimais" class="animal-counter">0 publicações</span>
        </div>

        <section id="listaAnimais" class="row g-4">
            <div class="col-12">
                <div class="animal-empty">
                    <div class="spinner-border" role="status"></div>
                    <p class="mb-0 mt-3">Carregando publicações...</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="text-center">
        <small>Proteja • Respeite • Ame</small>
    </footer>

    <script src="{{ url_for('static', filename='js/animais-publicacoes.js', v='1') }}"></script>
</body>
</html>
