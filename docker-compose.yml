services:
  # Backend da aplicação (Flask)
  server:
    build: ./Server
    container_name: flask_server
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      FLASK_ENV: "production"
      DATABASE_HOST: "${DATABASE_HOST}"
      DATABASE_PORT: "3306"
      DATABASE_USER: "${DATABASE_USER}"
      DATABASE_PASSWORD: "${DATABASE_PASSWORD}"
      DATABASE_NAME: "${DATABASE_NAME}"
      MEMCACHED_HOST: "${MEMCACHED_HOST}"
      MEMCACHED_PORT: "${MEMCACHED_PORT}"
    env_file:
      - .env
    depends_on:
      mariadb:
        condition: service_healthy
      memcached:
        condition: service_healthy
    networks:
      - app-network
    restart: on-failure:3

  # Banco de dados de cache
  memcached:
    image: memcached:alpine
    container_name: cache_memcached
    ports:
      - "11211:11211"
    healthcheck:
      test: ["CMD-SHELL", "echo stats | nc 127.0.0.1 11211 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - app-network
    restart: unless-stopped

# Banco de dados relacional
  mariadb:
    image: mariadb:latest
    container_name: db_mariadb
    env_file:
      - .env
    environment:
      MARIADB_ROOT_PASSWORD: "${DATABASE_PASSWORD}"
      MARIADB_DATABASE: "${DATABASE_NAME}"
    env_file:
      - .env
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    volumes:
      - mariadb_data:/var/lib/mysql
      # Linha adicionada para carregar o SQL automaticamente:
      - ./Server/Databases/MariaDB_MauTratos.sql:/docker-entrypoint-initdb.d/MariaDB_MauTratos.sql:ro
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  # Explicitamos que o mariadb_data usa o driver padrão (local) do Docker
  mariadb_data:
    driver: local

networks:
  app-network:
    driver: bridge
