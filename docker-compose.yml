services:
  # Backend da aplicação (Flask)
  server:
    build: ./Server
    container_name: flask_server
    ports:
      - "8080:8080"
    environment:
      FLASK_ENV: "production"
      DATABASE_HOST: "${DATABASE_HOST}"
      DATABASE_PORT: "3306"
      DATABASE_USER: "${DATABASE_USER}"
      DATABASE_PASSWORD: "${DATABASE_PASSWORD}"
      DATABASE_NAME: "${DATABASE_NAME}"
      MEMCACHED_HOST: "${MEMCACHED_HOST}"
      MEMCACHED_PORT: "${MEMCACHED_PORT}"
    env_file:
      - .env
    depends_on:
      - mariadb
      - memcached
    networks:
      - app-network

  # Banco de dados de cache
  memcached:
    image: memcached:alpine
    container_name: cache_memcached
    ports:
      - "11211:11211"
    networks:
      - app-network

# Banco de dados relacional
  mariadb:
    image: mariadb:latest
    container_name: db_mariadb
    environment:
      MARIADB_ROOT_PASSWORD: "${DATABASE_PASSWORD}"
      MARIADB_DATABASE: "${DATABASE_NAME}"
    env_file:
      - .env
    ports:
      - "3307:3306"
    volumes:
      # Mantemos o volume nomeado para não perder os dados do banco
      - ./mariadb_data:/var/lib/mysql:z
    networks:
      - app-network

volumes:
  # Explicitamos que o mariadb_data usa o driver padrão (local) do Docker
  mariadb_data:
    driver: local

networks:
  app-network:
    driver: bridge