services:
  # Backend da aplicação (Flask)
  server:
    build: ./Server
    container_name: flask_server
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - DATABASE_HOST=mariadb
      - DATABASE_PORT=3306
      - DATABASE_USER=root
      - DATABASE_PASSWORD=19032007
      - DATABASE_NAME=MausTratosDB
      - MEMCACHED_HOST=memcached
      - MEMCACHED_PORT=11211
    depends_on:
      mariadb:
        condition: service_healthy
      memcached:
        condition: service_healthy
    networks:
      - app-network

  # Banco de dados de cache
  memcached:
    image: memcached:alpine
    container_name: cache_memcached
    ports:
      - "11211:11211"
    healthcheck:
      test: ["CMD-SHELL", "echo stats | nc 127.0.0.1 11211 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - app-network

  # Banco de dados relacional
  mariadb:
    image: mariadb:latest
    container_name: db_mariadb
    env_file:
      - .env
    environment:
      - MARIADB_ROOT_PASSWORD=19032007
      - MARIADB_DATABASE=MausTratosDB
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    volumes:
      - mariadb_data:/var/lib/mysql
      # Linha adicionada para carregar o SQL automaticamente:
      - ./Server/Databases/MariaDB_MauTratos.sql:/docker-entrypoint-initdb.d/MariaDB_MauTratos.sql:ro
    networks:
      - app-network

volumes:
  mariadb_data:

networks:
  app-network:
    driver: bridge